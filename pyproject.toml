[project]
name = "ros2-data-collection"
version = "0.1.0"
description = "Collect operational data from robots and route it to external infrastructure"
authors = [{ name = "David Bensoussan", email = "d.bensoussan@proton.me" }]
# Jazzy targets Ubuntu 24.04, whose interpreter is 3.12.
requires-python = ">=3.12"
dependencies = [
  "mcap>=1.4",
  # tools/e2e/scripts/load_driver.py (#378): the shipper ingest protocol's msgpack
  # framing, same library family dc_bridge's Forwarder uses (msgpack-cxx) on the C++ side.
  "msgpack>=1.0",
  # Jazzy's rclpy/cv_bridge are built against numpy 1.26; numpy 2 breaks that ABI.
  "numpy>=1.26,<2",
  "opencv-python>=4.9,<5",
  "Pillow>=10.4",
  # draw_image.py and the dashboard still use pydantic v1 APIs (BaseSettings).
  "pydantic>=1.10.13,<2",
]

# `uv sync` installs these too; `uv sync --no-dev` gets the runtime set alone.
[dependency-groups]
dev = [
  "prek>=0.4.3",
  # Keep in step with the ruff-pre-commit rev in .pre-commit-config.yaml.
  "ruff>=0.16.3,<0.17",
  "codespell>=2.4.2",
  # tools/infrastructure/test (the KPI views' fixture test).
  "pytest>=8.3",
  # dc_demos' Streamlit dashboard (dc_demos/dc_demos/streamlit_dashboard).
  "streamlit>=1.40",
  "pandas>=2.2",
  "plotly>=5.24",
  "SQLAlchemy>=2.0.11",
  "minio>=7.2",
  "psycopg2-binary>=2.9.9",
  # dc_simulation/tools/gen_qr_code_model.py.
  "Jinja2>=3.1.2",
  "typer>=0.15",
  "qrcode>=8",
  "pypng>=0.20220715",
]

# Not a distribution: the ROS packages are built by colcon, each with its own
# setup.py or CMakeLists.txt.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["doc/book", "doc/theme", "doc/js"]

[tool.ruff.lint]
# Parity with the flake8 + 13-plugin stack this replaced, and no more: ruff's own
# opinions beyond it (the rest of RUF, SIM, PTH, …) are left for a follow-up.
select = [
  "A",
  "B",
  "C4",
  "E",
  "EXE",
  "F",
  "G",
  "I",
  "LOG",
  "N",
  "Q",
  "RUF100",
  "T10",
  "UP",
  "W",
]
ignore = [
  # typer and pydantic both configure via call-valued defaults.
  "B008",
]

[tool.ruff.lint.per-file-ignores]
# Streamlit derives page titles and order from the filename (`1_System.py`).
"dc_demos/dc_demos/streamlit_dashboard/**" = ["N999"]

[tool.ruff.format]
quote-style = "double"
