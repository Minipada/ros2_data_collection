name: Compute image ref
description: >-
  Emits ghcr.io image references for one distro's runtime image (#533): an
  immutable :<distro>-<sha> ref (pushed on every build, PR included) and a
  floating :<distro> ref (the ref a deployment pins to). Both derive from the
  same distro lever as the build, so the floating tag can never name a distro
  whose content it doesn't carry. Adapted from ~/dev/monorepo's
  .github/actions/image-ref (which derives the floating tag from the branch
  slug — here the branch names and distros coincide, but the distro input is
  what guarantees the pairing). dc-ros/dc-uploader push floating_ref only on
  push to a distro branch; dc-workspace/dc-e2e don't use this action at all
  (plain :<sha>, computed inline in ci.yaml).

inputs:
  name:
    description: Image name (e.g. dc-ros), without registry host or tag.
    required: true
  distro:
    description: ROS distro the image was built for (e.g. jazzy, lyrical, rolling).
    required: true
  tag_suffix:
    description: >-
      Appended to both emitted tags (e.g. "-coverage" -> :<distro>-<sha>-coverage,
      :<distro>-coverage). Lets one image name carry a second, coverage-
      instrumented variant alongside the production tag. Defaults to none.
    required: false
    default: ""

outputs:
  sha_ref:
    description: ghcr.io/<owner>/<repo>/<name>:<distro>-<sha>
    value: ${{ steps.compute.outputs.sha_ref }}
  floating_ref:
    description: ghcr.io/<owner>/<repo>/<name>:<distro>
    value: ${{ steps.compute.outputs.floating_ref }}

runs:
  using: composite
  steps:
    - id: compute
      shell: bash
      env:
        SHA: ${{ github.sha }}
        REPO: ${{ github.repository }}
        NAME: ${{ inputs.name }}
        DISTRO: ${{ inputs.distro }}
        TAG_SUFFIX: ${{ inputs.tag_suffix }}
      run: |
        set -euo pipefail
        REGISTRY="ghcr.io/$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
        {
          echo "sha_ref=$REGISTRY/$NAME:$DISTRO-$SHA$TAG_SUFFIX"
          echo "floating_ref=$REGISTRY/$NAME:$DISTRO$TAG_SUFFIX"
        } >> "$GITHUB_OUTPUT"
