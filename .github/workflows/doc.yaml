# Docs build and publish for this distro's section of the versioned site (#534). Every
# distro branch (rolling, lyrical, jazzy) carries this same workflow and publishes its own
# build to /<distro>/ on the one Pages site via tools/ci/deploy_doc_site.sh — no step
# composes the site from all distros, and each publish leaves sibling sections alone.
#
# Like ci.yaml, this runs the same script a developer runs locally
# (tools/ci/pre-commit/build_doc.sh, also the `build-doc` pre-commit hook) inside a Podman
# image built from containers/doc/Containerfile — one pinned mdbook toolchain in both
# places. The build is a gate: mdbook's linkcheck backend fails the job on a broken
# internal link, and book.toml's `create-missing = false` fails it on a SUMMARY.md entry
# pointing at a missing page. External links are not followed — see the comment on
# `follow-web-links` in doc/book.toml.
#
# Build cache (#315): each run is a fresh runner, so podman's build cache is otherwise
# local-only — log into ghcr.io and pass a stable `dc-doc-cache` ref to build_doc.sh's
# --cache-from/--cache-to, so the rust toolchain + cargo-installed preprocessors layers
# stay warm on a cold runner. `packages: write` only lands for same-repo events; a fork
# PR pushes no cache and builds cold, which does not fail the build.
#
# PR preview (#135): on pull_request the built site is uploaded as a workflow artifact,
# not deployed — pushes to this branch are the only publisher. The job summary step links
# the artifact from the PR's Checks tab.

name: Documentation

on:
  workflow_dispatch:
  push:
    branches:
      - jazzy
    paths:
      - doc/**
      - requirements/**
      - containers/doc/Containerfile
      - tools/ci/pre-commit/build_doc.sh
      - tools/ci/deploy_doc_site.sh
      - .github/workflows/doc.yaml
  pull_request:
    branches:
      - jazzy
    paths:
      - doc/**
      - requirements/**
      - containers/doc/Containerfile
      - tools/ci/pre-commit/build_doc.sh
      - tools/ci/deploy_doc_site.sh
      - .github/workflows/doc.yaml

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify podman
        run: podman --version

      - name: Log in to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      # ghcr image names must be lowercase and GitHub expressions have no lowercase
      # function, so the ref is computed here rather than inline (same as ci.yaml).
      - name: Compute the cache ref
        id: refs
        env:
          REPO: ${{ github.repository }}
        run: |
          IMAGE="ghcr.io/$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
          echo "cache_ref=$IMAGE/dc-doc-cache" >> "$GITHUB_OUTPUT"

      - name: Build the documentation
        env:
          IMAGE_TAG: dc-doc:${{ github.sha }}
          CACHE_REF: ${{ steps.refs.outputs.cache_ref }}
          # The distro section this build publishes as: this branch on push, the target
          # branch for a PR preview. Same value either way on a distro branch — previews
          # build exactly what merging would publish.
          DISTRO: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
        run: ./tools/ci/pre-commit/build_doc.sh

      - name: Upload the built site
        id: upload-doc-site
        uses: actions/upload-artifact@v4
        with:
          name: doc-site
          path: doc/book/html

      - name: Link the preview from the job summary
        if: github.event_name == 'pull_request'
        env:
          ARTIFACT_URL: ${{ steps.upload-doc-site.outputs.artifact-url }}
          DISTRO: ${{ github.base_ref }}
        run: |
          {
            echo "### 📖 Documentation preview"
            echo
            echo "[Download the built site](${ARTIFACT_URL}) (\`doc-site\`)."
            echo
            echo "This is a workflow artifact, not a hosted deploy — unzip it and open"
            echo "\`${DISTRO}/index.html\`. Downloading requires a GitHub login with read"
            echo "access to this repo, same as any other Actions artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish this distro's section to GitHub Pages
        if: github.event_name == 'push'
        env:
          DISTRO: ${{ github.ref_name }}
        run: ./tools/ci/deploy_doc_site.sh
