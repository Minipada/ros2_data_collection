# DC 2.0 (Jazzy) CI (#249). This branch only builds the jazzy line (external Vector
# shipper, C++ dc_bridge — the Rust pilot of ADR-0004 was reverted in ADR-0007). The
# humble-line `industrial_ci`/Docker workflow this repo used to run doesn't apply here
# and isn't carried over onto this branch (it still exists on `humble`, a separate
# branch/tree — deleting it here doesn't touch that). Deliberately not industrial_ci,
# which is Docker-only anyway — this repo is moving off Docker in favor of Podman (see
# CLAUDE.md "Containers: Podman, not Docker").
#
# Builds the shared DC workspace image (tools/e2e/Containerfile, also used by the
# zero-loss E2E harness via tools/e2e/Containerfile.e2e), runs colcon test (C++ gtest
# across every package) with coverage, **publishes the image to ghcr.io**, then runs the
# harness. Image tagging follows the ~/dev/monorepo convention: an immutable `:<sha>` ref
# (pushed on every event) plus a floating `:<branch-slug>` ref (pushed on non-PR events).
#
# No CI-only build/test scripts: every step below calls the same
# tools/e2e/scripts/build.sh / test.sh / run.sh a developer runs locally.

name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - jazzy
  push:
    branches:
      - jazzy

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The registry-backed build cache (build.sh's --cache-from/--cache-to) and the published
# image refs are computed per job in a "Compute image refs" step, since ghcr requires a
# lowercased repository name and GitHub expressions have no lowercase function.

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify podman
        run: podman --version

      - name: Log in to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Immutable :<sha> + floating :<branch-slug> refs, mirroring the monorepo's
      # image-ref action. ghcr image names must be lowercase.
      - name: Compute image refs
        id: refs
        env:
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          IMAGE="ghcr.io/$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')/dc-workspace"
          REF="${HEAD_REF:-$REF_NAME}"
          SLUG="$(printf '%s' "$REF" \
            | sed -E 's#[^A-Za-z0-9_.-]+#-#g' \
            | sed -E 's#^[.-]+##; s#[.-]+$##' \
            | cut -c1-128)"
          {
            echo "image=$IMAGE"
            echo "sha_ref=$IMAGE:$SHA"
            echo "branch_ref=$IMAGE:$SLUG"
            echo "cache_ref=$IMAGE-cache"
          } >> "$GITHUB_OUTPUT"

      - name: Build the DC workspace image (coverage-instrumented)
        env:
          IMAGE_TAG: ${{ steps.refs.outputs.sha_ref }}
          CACHE_REF: ${{ steps.refs.outputs.cache_ref }}
          CCOV: "true"
        run: ./tools/e2e/scripts/build.sh

      - name: Start Postgres + RustFS (dc_bridge's store-backed tests hard-fail, never skip — see dc_bridge/README.md)
        run: |
          podman run -d --network host --name dc_pg_ci \
            -e POSTGRES_USER=dc -e POSTGRES_PASSWORD=password -e POSTGRES_DB=dc \
            docker.io/library/postgres:13
          podman run -d --network host --name dc_rustfs_ci \
            docker.io/rustfs/rustfs:latest
          timeout 60 bash -c 'until podman exec dc_pg_ci pg_isready -U dc >/dev/null 2>&1; do sleep 1; done'
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:9000 >/dev/null 2>&1 || curl -s http://127.0.0.1:9000 >/dev/null 2>&1; do sleep 1; done'
          # A `dc-records` bucket the store-backed tests can use (the S3 sink doesn't
          # create it). AWS CLI over --endpoint-url speaks the same S3 protocol dc_bridge's
          # Uploader does — no separate object-store client (the retired minio/mc) needed.
          podman run --rm --network host \
            -e AWS_ACCESS_KEY_ID=rustfsadmin -e AWS_SECRET_ACCESS_KEY=rustfsadmin -e AWS_DEFAULT_REGION=us-east-1 \
            docker.io/amazon/aws-cli:latest \
            --endpoint-url http://127.0.0.1:9000 s3 mb s3://dc-records

      - name: colcon test (C++ gtest) + coverage
        env:
          IMAGE: ${{ steps.refs.outputs.sha_ref }}
        run: ./tools/e2e/scripts/test.sh "$PWD/coverage"

      # Only reached when the build + tests above passed, so a broken image is never
      # published. :<sha> on every event; :<branch-slug> on non-PR (push to jazzy).
      - name: Push the workspace image
        env:
          SHA_REF: ${{ steps.refs.outputs.sha_ref }}
          BRANCH_REF: ${{ steps.refs.outputs.branch_ref }}
        run: |
          push() {
            for attempt in 1 2 3; do
              podman push "$1" && return 0
              echo "push $1 attempt $attempt failed; retrying in 10s"; sleep 10
            done
            return 1
          }
          push "$SHA_REF"
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            podman tag "$SHA_REF" "$BRANCH_REF"
            push "$BRANCH_REF"
          fi

      - name: Stop Postgres + RustFS
        if: always()
        run: podman rm -f dc_pg_ci dc_rustfs_ci

      - name: Upload C++ coverage
        if: always()
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/cpp.info
          flags: cpp-jazzy

  e2e:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify podman
        run: podman --version

      # run.sh pins the socket-free podman-compose provider (see its header); the runner
      # doesn't ship it. Pure-podman, no docker-compose plugin / Docker API socket.
      - name: Install podman-compose
        run: |
          pip install --user podman-compose
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Log in to ghcr.io (to pull the workspace image build-and-test pushed)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      # The immutable :<sha> ref build-and-test built, tested, and pushed. This job uses
      # that exact artifact — it does not rebuild the workspace (one job builds, one uses).
      - name: Compute workspace image ref
        id: refs
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          echo "sha_ref=ghcr.io/$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')/dc-workspace:$SHA" >> "$GITHUB_OUTPUT"

      - name: Run zero-loss E2E harness (CI-sized outage window)
        # Same code paths as the full 10-minute local proof (tools/e2e/README.md); CI
        # uses a shorter outage window so the job finishes in reasonable time. Both the
        # startup-latency gate (<10s) and the zero-loss/exactly-once gate are real,
        # hard-failing assertions here — nothing is skipped or informational except the
        # resource-usage report. DC_WORKSPACE_IMAGE points run.sh at the tested image
        # from build-and-test, so the harness reuses it instead of rebuilding.
        env:
          DC_E2E_OUTAGE_SECONDS: "60"
          DC_E2E_STEADY_STATE_SECONDS: "30"
          DC_WORKSPACE_IMAGE: ${{ steps.refs.outputs.sha_ref }}
        run: ./tools/e2e/scripts/run.sh

      - name: Upload E2E harness logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-harness-logs
          path: tools/e2e/.run/**
