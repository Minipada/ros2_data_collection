measurement_server:
  ros__parameters:
    measurement_plugins: ["uptime"]
    uptime:
      plugin: "dc_measurements/Uptime"
      group_key: "uptime"
      topic_output: "/dc/measurement/uptime"

dc_bridge:
  ros__parameters:
    # ADR-0003 config contract: the config renderer (dc_bridge_core::render) turns
    # `shipper`/`destinations` into a complete Vector config. `pgsql` here matches
    # tools/infrastructure/docker/docker-compose.postgresql.yaml's credentials.
    shipper:
      data_dir: "$HOME/.dc/buffer"
    destinations: ["pgsql"]
    pgsql:
      type: postgres
      receives: records
      inputs: ["/dc/measurement/uptime"]
      host: "127.0.0.1"
      port: 5432
      user: "dc"
      password: "password"
      database: "dc"
      table: "dc"
      time_key: "date"
      time_format: "double"
    # The other blessed destination types (add the name to `destinations` to enable):
    #
    # rustfs:                     # S3-compatible object storage (self-hosted: RustFS
    #   type: s3                  # recommended, since MinIO's community edition was
    #   receives: records         # archived upstream; Ceph and AWS S3 work the same)
    #   inputs: ["/dc/measurement/uptime"]
    #   bucket: "dc-records"
    #   endpoint: "http://127.0.0.1:9000"   # omit for AWS S3
    #   region: "us-east-1"
    #   access_key_id: "rustfsadmin"        # omit both to use ambient AWS credentials
    #   secret_access_key: "$DC_S3_SECRET"  # $VAR / ${VAR} env references are expanded
    #   force_path_style: true              # path-style addressing for self-hosted stores
    #   key_prefix: "robot1/"
    #   batch_timeout_secs: 60              # object write interval; Vector default 300
    #
    # local_log:                  # newline-delimited JSON on local disk
    #   type: file
    #   receives: records
    #   inputs: ["/dc/measurement/uptime"]
    #   path: "/var/log/dc/records-%Y-%m-%d.log"
    #
    # debug_console:              # JSON on the Bridge's stdout (debugging)
    #   type: console
    #   receives: records
    #   inputs: ["/dc/measurement/uptime"]
    #
    # File uploads (ADR-0005): a `receives: files` destination is served by the
    # Bridge's Uploader, not by a Vector sink — Records on its `inputs` topics are
    # scanned for the `local_paths`/`remote_paths` File references Measurements embed
    # (camera, map, …), each File is uploaded (multipart + resumable for large ones)
    # and verified, and per-File status plus group-completion metadata Records are
    # routed to `files.metadata_destination`. The destination name ("rustfs" here) must
    # match the key the Measurement writes under `remote_paths`.
    #
    # rustfs:
    #   type: s3
    #   receives: files
    #   inputs: ["/dc/measurement/camera"]
    #   bucket: "dc-files"
    #   endpoint: "http://127.0.0.1:9000"
    #   access_key_id: "rustfsadmin"
    #   secret_access_key: "$DC_S3_SECRET"
    #   force_path_style: true
    # files:
    #   delete_when_sent: true         # delete local Files after verified upload everywhere
    #   metadata_destination: "pgsql"  # receives the dc.files status/metadata Records
    #   ffprobe_binary: "ffprobe"      # video duration probe (optional)
    #   # Retention (#267): the un-uploaded intent queue never abandons an intent on its
    #   # own — a robot (or store) offline for weeks accumulates Files without bound.
    #   # Absent/zero = unlimited, matching Humble. Configuring this is an explicit,
    #   # audited opt-in to shedding the oldest un-uploaded Files under disk pressure —
    #   # see doc/src/dc/destinations.md's "Retention" section before enabling it.
    #   retention:
    #     max_bytes: 10737418240  # 10 GiB cap on the un-uploaded Files pool
    #     max_age_days: 30        # optional; whichever limit is hit first
    #
    # Any other Vector sink type via the ADR-0003 passthrough: raw Vector config
    # snippets consuming the public per-Tag `dc.<tag>` routes (see
    # doc/src/dc/destinations.md for the routing contract).
    # custom_config_files: ["$HOME/.dc/custom_sinks.toml"]
    vector_forward_host: "127.0.0.1"
    vector_forward_port: 24224
