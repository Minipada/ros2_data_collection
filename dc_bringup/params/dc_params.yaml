measurement_server:
  ros__parameters:
    measurement_plugins: ["uptime"]
    uptime:
      plugin: "dc_measurements/Uptime"
      group_key: "uptime"
      topic_output: "/dc/measurement/uptime"

dc_bridge:
  ros__parameters:
    # ADR-0003 config contract: the config renderer (dc_bridge_core::render) turns
    # `shipper`/`destinations` into a complete Vector config. `pgsql` here matches
    # tools/infrastructure/docker/docker-compose.postgresql.yaml's credentials.
    shipper:
      data_dir: "$HOME/.dc/buffer"
      # managed: true                # default — the Bridge spawns/supervises the Shipper.
      #                               # Right for single-robot/simulation/local dev (this
      #                               # file's own setup). false = unmanaged mode (#444),
      #                               # for a multi-container/orchestrator-managed deploy:
      #                               # an orchestrator owns the Shipper's lifecycle; the
      #                               # Bridge only renders the config below and connects.
      #                               # See doc/src/dc/destinations.md#deployment-modes-shippermanaged.
      # config_path: "/shared/vector.toml"  # optional; defaults to a temp-file path.
      #                              # Written atomically (write then rename) so a Shipper
      #                              # watching it (unmanaged mode) never reads a partial
      #                              # write. Set this to a path on a volume shared with
      #                              # the Shipper container/pod in unmanaged mode.
    destinations: ["pgsql"]
    pgsql:
      type: postgres
      receives: records
      inputs: ["/dc/measurement/uptime"]
      host: "127.0.0.1"
      port: 5432
      user: "dc"
      password: "password"
      database: "dc"
      table: "dc"
      time_key: "date"
      # epoch_nanos (default) = exact integer nanoseconds since the epoch; iso8601 =
      # "…T11:36:28.123456789" string; double = fractional seconds, which is a float64
      # and rounds below ~1 us. Match the column type: bigint for epoch_nanos.
      time_format: "epoch_nanos"
    # The other blessed destination types (add the name to `destinations` to enable):
    #
    # rustfs:                     # S3-compatible object storage (self-hosted: RustFS
    #   type: s3                  # recommended, since MinIO's community edition was
    #   receives: records         # archived upstream; Ceph and AWS S3 work the same)
    #   inputs: ["/dc/measurement/uptime"]
    #   bucket: "dc-records"
    #   endpoint: "http://127.0.0.1:9000"   # omit for AWS S3
    #   region: "us-east-1"
    #   access_key_id: "rustfsadmin"        # omit both to use ambient AWS credentials
    #   secret_access_key: "$DC_S3_SECRET"  # $VAR / ${VAR} env references are expanded
    #   force_path_style: true              # path-style addressing for self-hosted stores
    #   key_prefix: "robot1/"
    #   batch_timeout_secs: 60              # object write interval; Vector default 300
    #
    # local_log:                  # newline-delimited JSON on local disk
    #   type: file
    #   receives: records
    #   inputs: ["/dc/measurement/uptime"]
    #   path: "/var/log/dc/records-%Y-%m-%d.log"
    #
    # debug_console:              # JSON on the Bridge's stdout (debugging)
    #   type: console
    #   receives: records
    #   inputs: ["/dc/measurement/uptime"]
    #
    # File uploads (ADR-0005): a `receives: files` destination is served by the
    # Bridge's Uploader, not by a Vector sink — Records on its `inputs` topics are
    # scanned for the `local_paths`/`remote_paths` File references Measurements embed
    # (camera, map, …), each File is uploaded (multipart + resumable for large ones)
    # and verified, and per-File status plus group-completion metadata Records are
    # routed to `files.metadata_destination`. The destination name ("rustfs" here) must
    # match the key the Measurement writes under `remote_paths`.
    #
    # rustfs:
    #   type: s3
    #   receives: files
    #   inputs: ["/dc/measurement/camera"]
    #   bucket: "dc-files"
    #   endpoint: "http://127.0.0.1:9000"
    #   access_key_id: "rustfsadmin"
    #   secret_access_key: "$DC_S3_SECRET"
    #   force_path_style: true
    # files:
    #   delete_when_sent: true         # delete local Files after verified upload everywhere
    #   metadata_destination: "pgsql"  # receives the dc.files status/metadata Records
    #   ffprobe_binary: "ffprobe"      # video duration probe (optional)
    #   # Retention (#267): the un-uploaded intent queue never abandons an intent on its
    #   # own — a robot (or store) offline for weeks accumulates Files without bound.
    #   # Absent/zero = unlimited, matching Humble. Configuring this is an explicit,
    #   # audited opt-in to shedding the oldest un-uploaded Files under disk pressure —
    #   # see doc/src/dc/destinations.md's "Retention" section before enabling it.
    #   retention:
    #     max_bytes: 10737418240  # 10 GiB cap on the un-uploaded Files pool
    #     max_age_days: 30        # optional; whichever limit is hit first
    #   # Thumbnails (#256): upload a small JPEG preview next to each image/video File
    #   # (`<remote_path>.thumb.jpg`) and record it in the status Record's
    #   # `thumbnail_path`, so gallery views load previews instead of full-size camera
    #   # Files. Off by default. Generation shells out to ffmpeg and is best-effort:
    #   # it runs only after the File itself is verified and can never fail, delay or
    #   # retry the upload — at worst there is no preview.
    #   thumbnails:
    #     enabled: true
    #     max_dimension: 320        # bound on the preview's longest side, in pixels
    #     ffmpeg_binary: "ffmpeg"   # override if it isn't on PATH
    #
    # Raw topic collection (#227): subscribe to topics dc_bridge was never compiled
    # against (rclcpp::GenericSubscription + runtime introspection, as `ros2 bag record
    # -a` does), convert each message to JSON, and ship it under the Tag
    # `dc.raw.<topic>` to one Destination. Works next to the Measurements above, or on
    # its own via `ros2 launch dc_bringup dc_raw.launch.py` (params/dc_raw_params.yaml).
    # Read doc/src/dc/raw_topics.md — especially "Backpressure and volume" — first.
    #
    # raw:
    #   enabled: true
    #   destination: "pgsql"        # a configured `receives: records` destination
    #   include: ["^/"]             # topic-name regexes (unanchored regex_search)
    #   exclude: ["^/rosout$", "^/parameter_events$", "^/dc/measurement/", "^/dc/group/"]
    #   exclude_types: ["^sensor_msgs/msg/(Image|CompressedImage|PointCloud2)$"]
    #   rescan_interval_secs: 5.0   # pick up topics that appear later; 0 = scan once
    #   max_rate_hz: 10.0           # per topic, newest-wins decimation; 0 = unlimited
    #   max_message_size_bytes: 1048576   # drop bigger messages whole; 0 = unlimited
    #
    # Any other Vector sink type via the ADR-0003 passthrough: raw Vector config
    # snippets consuming the public per-Tag `dc.<tag>` routes (see
    # doc/src/dc/destinations.md for the routing contract).
    # custom_config_files: ["$HOME/.dc/custom_sinks.toml"]
    vector_forward_host: "127.0.0.1"
    vector_forward_port: 24224

# MCAP recording (ADR-0009, #210): record Records as ros2 bag/Foxglove-replayable
# .mcap files. Not a `dc_bridge` Destination (Vector has no MCAP sink, and teaching
# dc_bridge a fifth blessed type would mean touching it, which ADR-0009 avoids) — a
# top-level block instead, sibling to dc_bridge above, that dc_bringup.launch.py reads
# to both start the standalone `dc_mcap_writer` process and generate its matching
# Vector passthrough sink automatically. See doc/src/dc/demos/mcap_recording.md.
#
# dc_mcap_writer:
#   ros__parameters:
#     enabled: true
#     inputs: ["/dc/measurement/uptime"]   # same shape as a Destination's `inputs`
#     output_dir: "$HOME/.dc/mcap"
#     host: "127.0.0.1"                    # dc_mcap_writer's own TCP listener
#     port: 9191
#     max_bytes: 134217728                 # rotate past this size; 128 MiB default
#     max_duration_secs: 300               # rotate past this age; 5 min default
#     prefix: "records"                    # filename prefix for each rotation
