# Robot tier, site A (#452). Two of deploy/robot/kubernetes/robot-pod.yaml's three
# containers — dc-ros and vector, not dc-uploader: ../params/robot-a-params.yaml's only Measurement
# (`uptime`) produces no Files, so there is nothing for an Uploader to do, and adding one
# with no work would test nothing #452's acceptance criteria ask for (Records only).
# deploy/robot/kubernetes/robot-pod.yaml remains the real three-container deployable
# reference; this is a deliberately narrower harness Pod.
#
# ConfigMap instead of that file's hostPath, per its own header: "a Pod-scoped
# Secret/ConfigMap object is the real-cluster mechanism" — this is that real cluster.
# The `robot-a-params` ConfigMap is created from ../params/robot-a-params.yaml before
# this file is applied.
#
# Image refs are real, committed defaults, not a harness-only tag: `dc-ros:jazzy` is
# the floating branch ref `build-dc-ros-image` pushes on every merge to jazzy — the ref
# a real deployment actually pins to (`:latest` isn't a tag this repo relies on). The
# same literal `vector` version robot-pod.yaml pins — bump both by hand alongside that
# file's own, per #448. `dc-ros`'s ref is substituted only when overridden (same
# convention as deploy/robot/scripts/verify_kube_play.sh: an unset DC_ROS_IMAGE leaves
# the manifest's own committed ref untouched), which is what lets CI test the PR's
# just-built image while a plain local run exercises the real one — one workflow for
# both, not a dev-only shortcut.
apiVersion: v1
kind: Pod
metadata:
  name: dc-robot
  namespace: dc-robot-a
  labels:
    app.kubernetes.io/part-of: dc-robot-tier
spec:
  restartPolicy: Always
  # Both containers share the Pod's network namespace, same as robot-pod.yaml — dc-ros's
  # vector_forward_host: "vector" (robot-a-params.yaml) resolves via this alias.
  hostAliases:
    - ip: "127.0.0.1"
      hostnames: ["vector"]
  containers:
    - name: dc-ros
      image: ghcr.io/minipada/ros2_data_collection/dc-ros:jazzy
      args: ["dc_params_file:=/opt/dc/robot_params.yaml", "run_uploader:=false"]
      volumeMounts:
        - name: config
          mountPath: /etc/dc/shipper
        - name: robot-params
          mountPath: /opt/dc/robot_params.yaml
          subPath: robot_params.yaml
          readOnly: true

    - name: vector
      image: docker.io/timberio/vector:0.57.0-debian
      command: ["/bin/sh", "-c"]
      args:
        - >
          trap exit TERM;
          until [ -f /etc/dc/shipper/vector.toml ]; do sleep 0.2; done;
          exec vector --config /etc/dc/shipper/vector.toml --watch-config
      volumeMounts:
        - name: buffer
          mountPath: /var/lib/vector
        - name: config
          mountPath: /etc/dc/shipper
          readOnly: true

  volumes:
    - name: config
      emptyDir: {}
    - name: buffer
      emptyDir: {}
    - name: robot-params
      configMap:
        name: robot-a-params
