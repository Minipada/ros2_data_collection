version: '3.1'

services:
  db:
    image: postgres:13
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dc
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dc
    ports:
      - 5432:5432
    volumes:
      # Numbered targets: the entrypoint runs these in name order, and the KPI views need
      # the tables to exist first.
      - ./config/postgresql/init.sql:/docker-entrypoint-initdb.d/10_init.sql:ro
      - ../sql/kpi_views.sql:/docker-entrypoint-initdb.d/20_kpi_views.sql:ro
