version: '3.1'

services:
  db:
    image: postgres:13
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dc
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dc
    ports:
      - 5432:5432
    volumes:
      - ./config/postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
