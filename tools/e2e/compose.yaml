# Zero-loss E2E harness (#249). Run via `podman compose`, not `docker compose` — see
# CLAUDE.md "Containers: Podman, not Docker". One command: tools/e2e/scripts/run.sh
# (which also builds the images and drives the outage/restart/verification sequence
# around this compose stack — `podman compose up` alone only starts the pipeline).
#
# Volumes are named (not host bind-mounts) so a "full stack restart"
# (`podman compose restart dc` / `down` + `up`) preserves dc_bridge's on-disk buffer
# (shipper.data_dir) and Postgres's data directory — that persistence is exactly what
# makes the zero-loss guarantee (ADR-0002) survive a restart, not just a live process.

services:
  postgres:
    image: docker.io/library/postgres:13
    environment:
      POSTGRES_USER: dc
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dc
    volumes:
      - dc_e2e_pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dc"]
      interval: 2s
      timeout: 3s
      retries: 30

  rustfs:
    image: docker.io/rustfs/rustfs:latest
    volumes:
      - dc_e2e_rustfs:/data
    ports:
      - "127.0.0.1:9000:9000"

  dc:
    # Built by tools/e2e/scripts/run.sh (plain `podman build`, not a `build:` block
    # here) with `--ignorefile /dev/null`: the repo's .dockerignore is an "ignore
    # everything, whitelist package.xml" allowlist meant for the deps-only
    # ci/jazzy/Containerfile image (mirroring docker/ci/Dockerfile's own narrow needs)
    # — a full-workspace build needs every source file, the same reason
    # docker.yaml's `source`/`source-sim` jobs `rm .dockerignore` before building.
    image: dc-e2e:latest
    network_mode: host
    volumes:
      - dc_e2e_buffer:/root/.dc/e2e/buffer
      - dc_e2e_data:/root/.dc/e2e/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  dc_e2e_pgdata:
  dc_e2e_rustfs:
  dc_e2e_buffer:
  dc_e2e_data:
