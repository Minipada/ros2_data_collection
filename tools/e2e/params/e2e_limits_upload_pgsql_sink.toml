# ADR-0003 passthrough equivalent of the blessed `pgsql_files` Destination, retired by
# #472 — see doc/src/dc/destinations.md's "Recipes: postgres, s3, console via
# passthrough". `pgsql_files` in e2e_limits_upload_params.yaml is now a `type: file`
# anchor only (named by `files.metadata_destination`); the real delivery to Postgres
# happens here. `dc-e2e-upload-postgres`, not 127.0.0.1: run_limits_upload_concurrency.sh's
# shared Postgres, resolved over its own bridge network — see that file's header.

[sinks.pgsql_files_store]
type = "postgres"
inputs = ["dc.dc.files"]
endpoint = "postgres://dc:password@dc-e2e-upload-postgres:5432/dc"
table = "dc_files"

[sinks.pgsql_files_store.buffer]
type = "disk"
max_size = 268435488
