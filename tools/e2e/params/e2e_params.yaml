measurement_server:
  ros__parameters:
    save_local_base_path: "$HOME/.dc/e2e/data/%Y/%M/%D/%H"
    all_base_path: "e2e"
    measurement_plugins: ["memory", "os", "storage", "uptime", "tcp_health", "dummy", "synth00", "synth01", "synth02", "synth03", "synth04", "synth05", "synth06", "synth07", "synth08", "synth09", "synth10", "synth11", "synth12", "synth13", "camera"]

    memory:
      plugin: "dc_measurements/Memory"
      # 5 Hz, unlike every other Measurement here. Deliberate: it is the only topic that
      # puts several Records inside the same wall-clock second, which is what makes the
      # timestamp-resolution check in verify_zero_loss.py meaningful. At 1 Hz a
      # regression to whole-second timestamps (#308) would not collide and would pass.
      polling_interval: 200
      group_key: "memory"

    os:
      plugin: "dc_measurements/OS"
      polling_interval: 1000
      group_key: "os"

    storage:
      plugin: "dc_measurements/Storage"
      polling_interval: 1000
      path: "/tmp"
      group_key: "storage"

    uptime:
      plugin: "dc_measurements/Uptime"
      polling_interval: 1000
      group_key: "uptime"

    tcp_health:
      plugin: "dc_measurements/TCPHealth"
      polling_interval: 1000
      name: "vector_forward"
      host: "127.0.0.1"
      port: 24224
      group_key: "tcp_health"

    dummy:
      plugin: "dc_measurements/Dummy"
      polling_interval: 1000
      group_key: "dummy"

    camera:
      plugin: "dc_measurements/Camera"
      polling_interval: 15000
      cam_name: "e2e_camera"
      cam_topic: "/dc/e2e/camera/image_raw"
      draw_det_barcodes: false
      # No detection_modules key: an empty list ([]) has no inferable element type, so
      # launch_ros rejects it when measurement_server loads as a composable node
      # ("got '()' of type tuple"). The Camera plugin defaults it to an empty vector
      # (declare_parameter_if_not_declared, camera.cpp), which is exactly what we want.
      save_raw_img: true
      save_rotated_img: false
      save_detections_img: false
      save_raw_base64: false
      save_rotated_base64: false
      save_inspected_base64: false
      remote_keys: ["rustfs"]
      remote_prefixes: ["camera"]
      group_key: "camera"

    synth00:
      plugin: "dc_measurements/StringStamped"
      enable_validator: false
      polling_interval: 1000
      topic: "/dc/e2e/synth/synth00"
      timer_based: true

    synth01:
      plugin: "dc_measurements/StringStamped"
      enable_validator: false
      polling_interval: 1000
      topic: "/dc/e2e/synth/synth01"
      timer_based: true

    synth02:
      plugin: "dc_measurements/StringStamped"
      enable_validator: false
      polling_interval: 1000
      topic: "/dc/e2e/synth/synth02"
      timer_based: true

    synth03:
      plugin: "dc_measurements/StringStamped"
      enable_validator: false
      polling_interval: 1000
      topic: "/dc/e2e/synth/synth03"
