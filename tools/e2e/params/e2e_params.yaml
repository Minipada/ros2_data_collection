dc_bridge:
  ros__parameters:
    shipper:
      data_dir: "$HOME/.dc/e2e/buffer"
    # Deliberately a different directory from shipper.data_dir (#441), on its own
    # dc_e2e_uploader volume (see run.sh) — exercises the split rather than only ever
    # proving the same-directory default still works.
    uploader:
      data_dir: "$HOME/.dc/e2e/uploader"
    destinations: ["pgsql_records", "pgsql_files", "rustfs", "raw_file"]
    pgsql_records:
      type: postgres
      receives: records
      inputs: ["/dc/measurement/memory", "/dc/measurement/os", "/dc/measurement/storage", "/dc/measurement/uptime", "/dc/measurement/tcp_health", "/dc/measurement/dummy", "/dc/measurement/synth00", "/dc/measurement/synth01", "/dc/measurement/synth02", "/dc/measurement/synth03", "/dc/measurement/synth04", "/dc/measurement/synth05", "/dc/measurement/synth06", "/dc/measurement/synth07", "/dc/measurement/synth08", "/dc/measurement/synth09", "/dc/measurement/synth10", "/dc/measurement/synth11", "/dc/measurement/synth12", "/dc/measurement/synth13"]
      host: "127.0.0.1"
      port: 5432
      user: "dc"
      password: "password"
      database: "dc"
      table: "dc_records"
      time_key: "date"

    pgsql_files:
      type: postgres
      receives: records
      # No `inputs` key: this destination takes no topic subscriptions — it's the Files
      # metadata_destination (see `files.metadata_destination` below), fed internally by
      # the Uploader. `inputs: []` can't be used: rclcpp can't load an empty YAML array
      # from a params file (no inferable element type) and dc_bridge fatals at startup
      # ("parameter_value_from failed ... No parameter value set"). Omitted → empty inputs.
      host: "127.0.0.1"
      port: 5432
      user: "dc"
      password: "password"
      database: "dc"
      table: "dc_files"
      time_key: "date"

    rustfs:
      type: s3
      receives: files
      inputs: ["/dc/measurement/camera"]
      bucket: "dc-e2e"
      endpoint: "http://127.0.0.1:9000"
      region: "us-east-1"
      access_key_id: "rustfsadmin"
      secret_access_key: "rustfsadmin"
      force_path_style: true

    # Raw / generic-subscription mode (#227). Subscribes to the generator's *source*
    # topic — `/dc/e2e/synth/synth00` carries `dc_interfaces/msg/StringStamped`, a
    # custom non-std_msgs type dc_bridge has no compile-time knowledge of — and ships it
    # under the `dc.raw.` Tag namespace to its own `file` Destination, entirely beside
    # the Measurement path that same topic already feeds. verify_zero_loss.py's
    # check_raw() asserts the Records arrived, decoded field-for-field, and have no gaps
    # inside the window raw mode was subscribed for.
    raw_file:
      type: file
      receives: records
      # No `inputs`: raw mode routes to this Destination by Tag namespace, not by topic.
      path: "/root/.dc/e2e/data/raw/records.ndjson"
      time_key: "date"

    raw:
      enabled: true
      destination: "raw_file"
      include: ["^/dc/e2e/synth/synth00$"]
      # The default excludes would veto nothing here, but spell out that the Record
      # topics stay out: without this raw mode would re-ship every Measurement Record
      # under a second Tag.
      exclude: ["^/rosout$", "^/parameter_events$", "^/dc/measurement/", "^/dc/group/"]
      exclude_types: ["^sensor_msgs/msg/(Image|CompressedImage|PointCloud2)$"]
      # 1 s below the generator's own 1 Hz, so discovery is quick without the rescan
      # itself becoming the thing under test.
      rescan_interval_secs: 1.0
      # Comfortably above the generator's 1 Hz: the limiter is exercised but must not
      # drop anything, so a gap in the output is real loss rather than decimation.
      max_rate_hz: 10.0

    files:
      delete_when_sent: false
      metadata_destination: "pgsql_files"

    # ADR-0003 passthrough: raw Vector sinks dc_bridge has no knowledge of, consuming the
    # public dc.<tag> routes. Their output is asserted by verify_zero_loss.py's
    # check_passthrough()/check_mcap_passthrough() with the same zero-loss standard as
    # the blessed Destinations. See params/e2e_passthrough_sink.toml for why a `file`
    # sink and why synth00/synth01, and params/e2e_mcap_sink.toml (ADR-0009, #210) for
    # the second, differently-shaped passthrough on synth02/synth03.
    custom_config_files: ["/opt/e2e/e2e_passthrough_sink.toml", "/opt/e2e/e2e_mcap_sink.toml"]

    vector_forward_host: "127.0.0.1"
    vector_forward_port: 24224

lifecycle_manager_dc:
  ros__parameters:
    node_names: ["measurement_server"]
    transitions: [configure, activate]
