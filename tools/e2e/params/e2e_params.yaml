dc_bridge:
  ros__parameters:
    shipper:
      data_dir: "$HOME/.dc/e2e/buffer"
    destinations: ["pgsql_records", "pgsql_files", "rustfs"]
    pgsql_records:
      type: postgres
      receives: records
      inputs: ["/dc/measurement/memory", "/dc/measurement/os", "/dc/measurement/storage", "/dc/measurement/uptime", "/dc/measurement/tcp_health", "/dc/measurement/dummy", "/dc/measurement/synth00", "/dc/measurement/synth01", "/dc/measurement/synth02", "/dc/measurement/synth03", "/dc/measurement/synth04", "/dc/measurement/synth05", "/dc/measurement/synth06", "/dc/measurement/synth07", "/dc/measurement/synth08", "/dc/measurement/synth09", "/dc/measurement/synth10", "/dc/measurement/synth11", "/dc/measurement/synth12", "/dc/measurement/synth13"]
      host: "127.0.0.1"
      port: 5432
      user: "dc"
      password: "password"
      database: "dc"
      table: "dc_records"
      time_key: "date"
      time_format: "double"

    pgsql_files:
      type: postgres
      receives: records
      # No `inputs` key: this destination takes no topic subscriptions — it's the Files
      # metadata_destination (see `files.metadata_destination` below), fed internally by
      # the Uploader. `inputs: []` can't be used: rclcpp can't load an empty YAML array
      # from a params file (no inferable element type) and dc_bridge fatals at startup
      # ("parameter_value_from failed ... No parameter value set"). Omitted → empty inputs.
      host: "127.0.0.1"
      port: 5432
      user: "dc"
      password: "password"
      database: "dc"
      table: "dc_files"
      time_key: "date"
      time_format: "double"

    rustfs:
      type: s3
      receives: files
      inputs: ["/dc/measurement/camera"]
      bucket: "dc-e2e"
      endpoint: "http://127.0.0.1:9000"
      region: "us-east-1"
      access_key_id: "rustfsadmin"
      secret_access_key: "rustfsadmin"
      force_path_style: true

    files:
      delete_when_sent: false
      metadata_destination: "pgsql_files"

    vector_forward_host: "127.0.0.1"
    vector_forward_port: 24224

lifecycle_manager_dc:
  ros__parameters:
    node_names: ["measurement_server"]
    transitions: [configure, activate]
