# The limits harness's two-tier topology scenario (#381, part of #323's epic). Otherwise
# byte-for-byte params/e2e_params.yaml (same Measurement plugins, same synth/camera
# workload — verify_zero_loss.py is reused unmodified and hard-requires this exact shape:
# the 6 REAL_TAGS, memory's sub-1s polling for the timestamp-resolution check, the
# camera/Files pipeline, and synth00-13 for the ledger/passthrough/mcap checks), except:
#
# - `pgsql_records` is replaced by `local_sink`, a `type: file` Destination. Its only job
#   is to make dc_bridge render `dc.<tag>` route branches for the Measurement/synth
#   topics (route branches come from a Destination's `inputs` — see render.cpp — there is
#   no way to get one without declaring some Destination); it writes to a throwaway local
#   path nothing reads. The actual "ship this to Postgres" job moves to
#   e2e_limits_forward_sink.toml's injected `vector`-type sink (ADR-0003
#   `custom_config_files` passthrough), which relays those same route branches on to
#   run_limits_two_tier.sh's aggregating Shipper over the network instead of writing
#   Records locally — this Bridge's own local Shipper never talks to the real Postgres at
#   all, standing in for "a robot with no direct path to the cloud" (#323's motivating
#   scenario).
# - `pgsql_files`/`rustfs` point at run_limits_two_tier.sh's shared Postgres/RustFS
#   containers by name (dc-e2e-limits-postgres/dc-e2e-limits-rustfs), not 127.0.0.1 — see
#   that file's header for why: the Uploader talks to whatever `s3`/`postgres` Destination
#   host is configured directly over AWS-SDK/libpq calls, with no Vector hop at all, so
#   there is no way to route Files (bytes or metadata) through the aggregating Shipper
#   without new DC code. Recorded as this ticket's discovery per its acceptance
#   criteria — Files bypass the two-tier chain; only Measurement Records go through it.
# - `custom_config_files` adds e2e_limits_forward_sink.toml alongside the existing
#   passthrough/MCAP snippets.

measurement_server:
  ros__parameters:
    save_local_base_path: "$HOME/.dc/e2e/data/%Y/%M/%D/%H"
    all_base_path: "e2e"
    measurement_plugins: ["memory", "os", "storage", "uptime", "tcp_health", "dummy", "synth00", "synth01", "synth02", "synth03", "synth04", "synth05", "synth06", "synth07", "synth08", "synth09", "synth10", "synth11", "synth12", "synth13", "camera"]

    memory:
      plugin: "dc_measurements/Memory"
      polling_interval: 200
      group_key: "memory"

    os:
      plugin: "dc_measurements/OS"
      polling_interval: 1000
      group_key: "os"

    storage:
      plugin: "dc_measurements/Storage"
      polling_interval: 1000
      path: "/tmp"
      group_key: "storage"

    uptime:
      plugin: "dc_measurements/Uptime"
      polling_interval: 1000
      group_key: "uptime"

    tcp_health:
      plugin: "dc_measurements/TCPHealth"
      polling_interval: 1000
      name: "vector_forward"
      host: "127.0.0.1"
      port: 24224
      group_key: "tcp_health"

    dummy:
      plugin: "dc_measurements/Dummy"
      polling_interval: 1000
      group_key: "dummy"

    camera:
      plugin: "dc_measurements/Camera"
      polling_interval: 15000
      cam_name: "e2e_camera"
      cam_topic: "/dc/e2e/camera/image_raw"
      draw_det_barcodes: false
      save_raw_img: true
      save_rotated_img: false
      save_detections_img: false
      save_raw_base64: false
      save_rotated_base64: false
      save_inspected_base64: false
      remote_keys: ["rustfs"]
      remote_prefixes: ["camera"]
      group_key: "camera"

    synth00:
      plugin: "dc_measurements/StringStamped"
      enable_validator: false
      polling_interval: 1000
      topic: "/dc/e2e/synth/synth00"
      timer_based: true

    synth01:
      plugin: "dc_measurements/StringStamped"
      enable_validator: false
      polling_interval: 1000
      topic: "/dc/e2e/synth/synth01"
      timer_based: true

