dc_bridge:
  ros__parameters:
    shipper:
      data_dir: "$HOME/.dc/e2e/buffer"
    destinations: ["local_sink", "pgsql_files", "rustfs", "raw_file"]

    # Creates the `dc.<tag>` route branches e2e_limits_forward_sink.toml's injected sink
    # reads from — see this file's header. Writes locally and is never read back; the
    # real egress for these Records is the injected `vector` sink below.
    local_sink:
      type: file
      receives: records
      inputs: ["/dc/measurement/memory", "/dc/measurement/os", "/dc/measurement/storage", "/dc/measurement/uptime", "/dc/measurement/tcp_health", "/dc/measurement/dummy", "/dc/measurement/synth00", "/dc/measurement/synth01", "/dc/measurement/synth02", "/dc/measurement/synth03", "/dc/measurement/synth04", "/dc/measurement/synth05", "/dc/measurement/synth06", "/dc/measurement/synth07", "/dc/measurement/synth08", "/dc/measurement/synth09", "/dc/measurement/synth10", "/dc/measurement/synth11", "/dc/measurement/synth12", "/dc/measurement/synth13"]
      path: "/root/.dc/e2e/data/local_sink/records.ndjson"
      time_key: "date"

    pgsql_files:
      type: postgres
      receives: records
      # dc-e2e-limits-postgres, not 127.0.0.1 — see this file's header: the Uploader
      # writes File metadata directly, with no Vector hop, so it bypasses the two-tier
      # chain and reaches run_limits_two_tier.sh's shared Postgres straight over the
      # network (its own bridge network — see that script for why).
      host: "dc-e2e-limits-postgres"
      port: 5432
      user: "dc"
      password: "password"
      database: "dc"
      table: "dc_files"
      time_key: "date"

    rustfs:
      type: s3
      receives: files
      inputs: ["/dc/measurement/camera"]
      bucket: "dc-e2e"
      # Same bypass as pgsql_files above — the Uploader's own AWS SDK client, not Vector.
      endpoint: "http://dc-e2e-limits-rustfs:9000"
      region: "us-east-1"
      access_key_id: "rustfsadmin"
      secret_access_key: "rustfsadmin"
      force_path_style: true

    # Raw / generic-subscription mode (#227): verify_zero_loss.py's check_raw() is
    # unconditional, so this stays enabled here too, unchanged from e2e_params.yaml — it
    # writes locally (a `file` Destination, same bypass reasoning as local_sink above)
    # rather than through the two-tier chain, since it has nothing to do with this
    # ticket's Measurement-Records-through-the-aggregator claim.
    raw_file:
      type: file
      receives: records
      path: "/root/.dc/e2e/data/raw/records.ndjson"
      time_key: "date"

    raw:
      enabled: true
      destination: "raw_file"
      include: ["^/dc/e2e/synth/synth00$"]
      exclude: ["^/rosout$", "^/parameter_events$", "^/dc/measurement/", "^/dc/group/"]
      exclude_types: ["^sensor_msgs/msg/(Image|CompressedImage|PointCloud2)$"]
      rescan_interval_secs: 1.0
      max_rate_hz: 10.0

    files:
      delete_when_sent: false
      metadata_destination: "pgsql_files"

    custom_config_files: ["/opt/e2e/e2e_passthrough_sink.toml", "/opt/e2e/e2e_mcap_sink.toml", "/opt/e2e/e2e_limits_forward_sink.toml"]

    # Same-container loopback (Bridge-to-own-local-Shipper) — never leaves the container,
    # so this stays 127.0.0.1 regardless of topology (same reasoning as
    # e2e_degraded_params.yaml).
    vector_forward_host: "127.0.0.1"
    vector_forward_port: 24224

lifecycle_manager_dc:
  ros__parameters:
    node_names: ["measurement_server"]
    transitions: [configure, activate]
