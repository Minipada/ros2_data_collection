[package]
name = "dc_bridge"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Bridge node: forwards DC Records from ROS topics to the Vector shipper over Fluent Forward"

[[bin]]
name = "dc_bridge"
path = "src/main.rs"

[dependencies]
# ROS-independent Forwarder/Supervisor/Readiness logic; a path dependency so it never
# needs registry resolution. See dc_bridge_core/ for its own standalone Cargo.toml and
# tests, runnable with plain `cargo test` (no ROS install required).
dc_bridge_core = { path = "dc_bridge_core" }
serde_json = "1"
# rclrs has no signal handling yet (see main.rs); this is what actually stops the
# supervised Vector process on a normal shutdown (Ctrl-C, `ros2 launch`, SIGTERM). The
# `termination` feature is required for SIGTERM/SIGHUP, not just SIGINT (Ctrl-C) —
# without it dc_bridge would only clean up on Ctrl-C, not on the SIGTERM `ros2 launch`
# and plain `kill <pid>` actually send.
ctrlc = { version = "3", features = ["termination"] }

# Only resolvable inside a colcon workspace built with the colcon-cargo /
# colcon-ros-cargo extensions (which generate the local registry these come from); see
# README.md. Not buildable with a plain `cargo build` outside that workspace.
rclrs = "*"
rosidl_runtime_rs = "*"
dc_interfaces = "*"
std_msgs = "*"
std_srvs = "*"

# The Jazzy build recipe (README.md) sources the rosidl_rust code generator from its git
# main branch, which emits idiomatic-message conversions (Sequence<T> -> Vec<T> for
# unbounded primitive arrays, e.g. dc_interfaces' DrawImage.srv `uint16[] color`) that
# require a rosidl_runtime_rs trait impl not yet in the crates.io 0.6.0 release. Patched
# to the matching git main branch so the generated code actually compiles.
[patch.crates-io]
rosidl_runtime_rs = { git = "https://github.com/ros2-rust/rosidl_runtime_rs.git" }
