data_dir = "/home/dc/.dc/buffer"

[acknowledgements]
enabled = true

[sinks.records_log]
inputs = ["dc.dc.group.robot"]
path = "/var/log/dc/records.log"
type = "file"

[sinks.records_log.buffer]
max_size = 268435488
type = "disk"

[sinks.records_log.encoding]
codec = "json"

[sources.dc_bridge_in]
address = "127.0.0.1:24224"
type = "fluent"

[transforms.dc]
inputs = ["dc_bridge_normalize"]
reroute_unmatched = false
type = "route"

[transforms.dc.route."dc.group.robot"]
source = '.tag == "dc.group.robot"'
type = "vrl"

[transforms.dc_bridge_normalize]
inputs = ["dc_bridge_in"]
source = """
if includes(["dc.group.robot"], .tag) {
  .date = format_timestamp!(.timestamp, format: "%Y-%m-%dT%H:%M:%S%.9f")
}
"""
type = "remap"
