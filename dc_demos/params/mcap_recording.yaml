dc_bridge:
  ros__parameters:
    shipper:
      data_dir: "$HOME/.dc/buffer"
    # `destinations` still has to name at least one blessed Destination — dc_bridge
    # derives both its ROS subscriptions and its `dc.<tag>` route branches from
    # `destinations` alone, and dc_mcap_writer's own `inputs` below never adds a route
    # dc_bridge doesn't already have. `console` is the cheapest thing to put here, and
    # doubles as a local view of the same Records dc_mcap_writer is recording.
    destinations: ["console"]
    console:
      type: console
      receives: records
      inputs:
        [
          "/dc/measurement/cpu",
          "/dc/measurement/memory",
          "/dc/measurement/os",
          "/dc/measurement/uptime",
        ]
      time_key: "date"
      time_format: "epoch_nanos"
    vector_forward_host: "127.0.0.1"
    vector_forward_port: 24224

# MCAP is not a blessed Destination type (only postgres, s3, file and console are —
# see doc/src/dc/destinations.md) and Vector has no MCAP sink at all, so recording goes
# through the ADR-0003/ADR-0009 passthrough — but configured here like any other
# Destination: dc_bringup.launch.py reads this block, starts the standalone
# dc_mcap_writer process, and generates its matching Vector sink automatically. No
# TOML to hand-author, no second terminal to start it in.
dc_mcap_writer:
  ros__parameters:
    enabled: true
    inputs:
      [
        "/dc/measurement/cpu",
        "/dc/measurement/memory",
        "/dc/measurement/os",
        "/dc/measurement/uptime",
      ]
    output_dir: "$HOME/dc_mcap_out"
    host: "127.0.0.1"
    port: 9191
    max_bytes: 134217728
    max_duration_secs: 300
    prefix: "records"

measurement_server:
  ros__parameters:
    measurement_plugins: ["cpu", "memory", "os", "uptime"]
    custom_key_str_list: ["robot_name"]
    custom_keys_str:
      robot_name:
        name: robot_name
        value: "C3PO"
    run_id:
      enabled: true
      counter: true
      counter_path: "$HOME/run_id"
      uuid: false
    cpu:
      plugin: "dc_measurements/Cpu"
      topic_output: "/dc/measurement/cpu"
      polling_interval: 5000
      include_measurement_name: true
      init_collect: true
      max_processes: 5
      cpu_min: 5.0
      nested: true
      flatten: false
    memory:
      plugin: "dc_measurements/Memory"
      topic_output: "/dc/measurement/memory"
      polling_interval: 5000
      include_measurement_name: true
      init_collect: true
      nested: true
      flatten: false
    os:
      plugin: "dc_measurements/OS"
      topic_output: "/dc/measurement/os"
      include_measurement_name: true
      init_collect: true
      init_max_measurements: 1
      nested: true
      flatten: false
    uptime:
      plugin: "dc_measurements/Uptime"
      topic_output: "/dc/measurement/uptime"
      polling_interval: 5000
      include_measurement_name: true
      init_collect: true
      nested: true
      flatten: false
