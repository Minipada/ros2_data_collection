dc_bridge:
  ros__parameters:
    shipper:
      data_dir: "$HOME/.dc/buffer"
    # Elasticsearch is not a blessed Destination type (only postgres, s3, file and
    # console are — see doc/src/dc/destinations.md), so it is reached through the
    # ADR-0003 passthrough: a raw Vector sink config listed in `custom_config_files`,
    # consuming the public `dc.<tag>` routes. Copy it into place before launching:
    #   mkdir -p ~/.dc && cp "$(ros2 pkg prefix dc_demos)/share/dc_demos/config/elasticsearch_sink.toml" ~/.dc/
    #
    # `destinations` still has to name at least one blessed Destination, and the routes
    # the snippet consumes exist only for topics listed in *its* `inputs` — dc_bridge
    # derives both its ROS subscriptions and its route branches from `destinations`, and
    # never reads the snippet's `inputs`. `console` is the cheapest thing to put there,
    # and doubles as a local view of the same Records that land in Elasticsearch.
    destinations: ["console"]
    console:
      type: console
      receives: records
      inputs:
        [
          "/dc/measurement/cpu",
          "/dc/measurement/memory",
          "/dc/measurement/os",
          "/dc/measurement/uptime",
        ]
      time_key: "date"
      time_format: "double"
    custom_config_files: ["$HOME/.dc/elasticsearch_sink.toml"]
    vector_forward_host: "127.0.0.1"
    vector_forward_port: 24224

measurement_server:
  ros__parameters:
    measurement_plugins: ["cpu", "memory", "os", "uptime"]
    custom_str_params_list: ["robot_name"]
    custom_str_params:
      robot_name:
        name: robot_name
        value: "C3PO"
    run_id:
      enabled: true
      counter: true
      counter_path: "$HOME/run_id"
      uuid: false
    cpu:
      plugin: "dc_measurements/Cpu"
      topic_output: "/dc/measurement/cpu"
      polling_interval: 5000
      include_measurement_name: true
      init_collect: true
      max_processes: 5
      cpu_min: 5.0
      nested: true
      flatten: false
    memory:
      plugin: "dc_measurements/Memory"
      topic_output: "/dc/measurement/memory"
      polling_interval: 5000
      include_measurement_name: true
      init_collect: true
      nested: true
      flatten: false
    os:
      plugin: "dc_measurements/OS"
      topic_output: "/dc/measurement/os"
      include_measurement_name: true
      init_collect: true
      init_max_measurements: 1
      nested: true
      flatten: false
    uptime:
      plugin: "dc_measurements/Uptime"
      topic_output: "/dc/measurement/uptime"
      polling_interval: 5000
      include_measurement_name: true
      init_collect: true
      nested: true
      flatten: false
