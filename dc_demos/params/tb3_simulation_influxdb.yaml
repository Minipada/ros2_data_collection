dc_bridge:
  ros__parameters:
    shipper:
      data_dir: "$HOME/.dc/buffer"
    # dc_bridge has no blessed InfluxDB destination (only postgres, s3, file, and
    # console are blessed — see doc/src/dc/destinations.md) so this demo shows the
    # ADR-0003 passthrough escape hatch instead: a raw Vector sink config loaded via
    # `custom_config_files`, consuming the public `dc.<tag>` routes documented in
    # doc/src/dc/destinations.md. Copy the example sink shipped with this package into
    # place before launching this demo:
    #   mkdir -p ~/.dc && cp "$(ros2 pkg prefix dc_demos)/share/dc_demos/config/tb3_simulation_influxdb_sink.toml" ~/.dc/
    #
    # `destinations` must still name at least one *blessed* Destination, and its `inputs`
    # are what create the `dc.<tag>` routes the snippet consumes — dc_bridge derives both
    # its ROS subscriptions and its route branches from `destinations`, and never reads
    # the snippet's own `inputs`. (`destinations: []` is not an option either: rclcpp
    # can't load an empty YAML array — no inferable element type — and dc_bridge fatals
    # at startup with "parameter_value_from failed for parameter 'destinations'", same
    # trap as `inputs: []`.) A `file` Destination is the cheapest thing to put here and
    # leaves a local trace of what was shipped; `console` would work too, but this demo
    # collects base64 camera and map images, which makes for unreadable terminal output.
    destinations: ["records_log"]
    records_log:
      type: file
      receives: records
      inputs:
        [
          "/dc/measurement/cpu",
          "/dc/measurement/memory",
          "/dc/measurement/os",
          "/dc/measurement/uptime",
          "/dc/measurement/camera",
          "/dc/measurement/cmd_vel",
          "/dc/measurement/distance_traveled",
          "/dc/measurement/position",
          "/dc/measurement/speed",
          "/dc/measurement/map",
          "/dc/measurement/influxdb_health",
        ]
      # Absolute, with no `$HOME`: unlike `shipper.data_dir` and `custom_config_files`,
      # a Destination's `path` is passed to Vector verbatim, and Vector does not expand
      # environment variables in it — `$HOME/x` silently becomes a literal `$HOME`
      # directory next to the Bridge's working directory. Vector does create the parent
      # directories.
      path: "/tmp/dc/tb3_simulation_influxdb_records.ndjson"
      time_key: "date"
      time_format: "double"
    custom_config_files: ["$HOME/.dc/tb3_simulation_influxdb_sink.toml"]
    vector_forward_host: "127.0.0.1"
    vector_forward_port: 24224

measurement_server:
  ros__parameters:
    robot_name: "Turtlebot"
    measurement_plugins: [
        # System
        "cpu",
        "os",
        "memory",
        "uptime",
        # Robot
        "camera",
        "cmd_vel",
        "distance_traveled",
        "position",
        "speed",
        # Environment
        "map",
        # Infrastructure
        "influxdb_health",
      ]
    custom_str_params_list: ["robot_name", "id"]
    custom_str_params:
      robot_name:
        name: robot_name
        value: "Turtlebot"
      # Requires systemd package
      id:
        name: id
        value_from_file: /etc/machine-id
    run_id:
      enabled: true
      counter: true
      counter_path: "$HOME/run_id"
      uuid: false
    save_local_base_path: "$HOME/dc_data/"
    all_base_path: "=robot_name/%Y/%m/%d/%H"
    condition_plugins: ["min_distance_traveled", "max_distance_traveled"]
    # Conditions
    min_distance_traveled:
      plugin: "dc_conditions/DoubleSuperior"
      key: "distance_traveled"
      value: 0.01
      include_value: true
      nested: true
      flatten: true
    max_distance_traveled:
      plugin: "dc_conditions/DoubleInferior"
      key: "distance_traveled"
      value: 2.0
      include_value: true
      nested: true
      flatten: true
    # System data
    cpu:
      plugin: "dc_measurements/Cpu"
      topic_output: "/dc/measurement/cpu"
      polling_interval: 5000
      include_measurement_name: true
      init_collect: true
      max_processes: 5
      cpu_min: 5.0
      nested: true
      flatten: true
    memory:
      plugin: "dc_measurements/Memory"
      topic_output: "/dc/measurement/memory"
      polling_interval: 5000
      node_name: "dc_measurement_memory"
      include_measurement_name: true
      init_collect: true
      nested: true
      flatten: true
    os:
      plugin: "dc_measurements/OS"
      topic_output: "/dc/measurement/os"
      include_measurement_name: true
      init_collect: true
      init_max_measurements: 1
      nested: true
      flatten: true
    uptime:
      plugin: "dc_measurements/Uptime"
      topic_output: "/dc/measurement/uptime"
      polling_interval: 5000
      debug: true
      init_collect: true
      include_measurement_name: true
      nested: true
      flatten: true
    # Robot data
    distance_traveled:
      plugin: "dc_measurements/DistanceTraveled"
      topic_output: "/dc/measurement/distance_traveled"
      if_all_conditions: ["min_distance_traveled", "max_distance_traveled"]
      global_frame: "map"
      robot_base_frame: "base_link"
      transform_timeout: 0.1
      polling_interval: 5000
      init_max_measurements: -1
      condition_max_measurements: 0
      include_measurement_name: true
      init_collect: false
      nested: true
      flatten: true
    cmd_vel:
      plugin: "dc_measurements/CmdVel"
      polling_interval: 500
      topic_output: "/dc/measurement/cmd_vel"
      include_measurement_name: true
      nested: true
      flatten: true
    position:
      plugin: "dc_measurements/Position"
      topic_output: "/dc/measurement/position"
      init_collect: true
      global_frame: "map"
      robot_base_frame: "base_link"
      transform_timeout: 0.1
      include_measurement_name: true
      nested: true
      flatten: true
    stops:
      plugin: "dc_measurements/Stops"
      odom_topic: "/odom"
      topic_output: "/dc/measurement/stops"
      include_measurement_name: true
      nested: true
      flatten: true
    speed:
      plugin: "dc_measurements/Speed"
      odom_topic: "/odom"
      polling_interval: 500
      topic_output: "/dc/measurement/speed"
      include_measurement_name: true
      nested: true
      flatten: true
    camera:
      plugin: "dc_measurements/Camera"
      topic_output: "/dc/measurement/camera"
      init_collect: false
      init_max_measurements: 0
      polling_interval: 3000
      node_name: "dc_measurement_camera"
      cam_topic: "/intel_realsense_r200_depth/image_raw"
      cam_name: "Intel Realsense"
      draw_det_barcodes: false
      save_raw_img: false
      save_raw_base64: true
      save_rotated_img: false
      save_detections_img: false
      rotation_angle: 0
      include_measurement_name: true
      include_measurement_plugin: true
      nested: true
      flatten: true
    # Environment data
    map:
      plugin: "dc_measurements/Map"
      save_path: "map/%Y-%m-%dT%H-%M-%S"
      save_base64: true
      topic_output: "/dc/measurement/map"
      save_map_timeout: 4.0
      init_collect: false
      init_max_measurements: 1
      include_measurement_name: true
      quiet: true
      nested: true
      flatten: true
    # Infrastructure
    influxdb_health:
      plugin: "dc_measurements/TCPHealth"
      topic_output: "/dc/measurement/influxdb_health"
      polling_interval: 5000
      host: "127.0.0.1"
      port: 8086
      name: "InfluxDB"
      include_measurement_plugin: true
      nested: true
      flatten: true
