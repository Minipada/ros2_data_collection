dc_bridge:
  ros__parameters:
    shipper:
      data_dir: "$HOME/.dc/buffer"
    destinations: ["console"]
    console:
      type: console
      receives: records
      inputs: ["/dc/measurement/uptime_custom"]
      time_key: "date"
      time_format: "double"
    vector_forward_host: "127.0.0.1"
    vector_forward_port: 24224

measurement_server:
  ros__parameters:
    measurement_plugins: ["uptime_custom"]
    run_id:
      enabled: false
    uptime_custom:
      plugin: "dc_demos/UptimeCustom"
      group_key: "uptime"
      topic_output: "/dc/measurement/uptime_custom"
      polling_interval: 5000
      enable_validator: true
      init_collect: true
