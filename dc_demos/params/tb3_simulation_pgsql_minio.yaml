dc_bridge:
  ros__parameters:
    shipper:
      data_dir: "$HOME/.dc/buffer"
    # blessed `postgres` is retired in favor of the ADR-0003 passthrough recipe (#471,
    # see doc/src/dc/destinations.md#recipes-postgres-s3-console-via-passthrough); `file`
    # is the anchor Destination `destinations` still needs -- dc_bridge derives its ROS
    # subscriptions and `dc.<tag>` routes from `destinations` alone, never from a
    # passthrough snippet's `inputs`. `records_log` also stands in for the old
    # `pgsql_files` Destination as `files.metadata_destination` below: that parameter
    # must name a configured `receives: records` Destination (dc_bridge rejects
    # anything else at startup), so it cannot point at a passthrough-only sink id --
    # the passthrough `pgsql_files` sink in the snippet instead consumes the
    # `dc.dc.files` route this anchor gains from being named there.
    #
    # `rustfs` (`type: s3`, `receives: files`) is unchanged and stays blessed: it is
    # served by the Uploader (`dc_uploader`, ADR-0005), a separate process configured
    # entirely from these ROS params and never from Vector sink config, so there is no
    # passthrough equivalent for `receives: files` to migrate to.
    #
    # Copy the passthrough sink into place first:
    #   mkdir -p ~/.dc && cp "$(ros2 pkg prefix dc_demos)/share/dc_demos/config/tb3_simulation_pgsql_minio_sink.toml" ~/.dc/
    # (dc_bringup.launch.py now stages this file automatically at launch time if
    # it's not already there -- see _stage_custom_config_files -- so this manual
    # step is only needed when running dc_bridge some other way.)
    destinations: ["records_log", "rustfs"]
    records_log:
      type: file
      receives: records
      inputs: [
          # System
          "/dc/measurement/cpu",
          "/dc/measurement/memory",
          "/dc/measurement/os",
          "/dc/measurement/uptime",
          # Robot
          "/dc/measurement/camera",
          "/dc/measurement/cmd_vel",
          "/dc/measurement/distance_traveled",
          "/dc/measurement/driving_type",
          "/dc/measurement/position",
          "/dc/measurement/speed",
          # Environment
          "/dc/measurement/map",
          # Infrastructure
          "/dc/measurement/rustfs_health",
          "/dc/measurement/pgsql_health",
        ]
      path: "/tmp/dc/tb3_simulation_pgsql_minio_records.ndjson"
      time_key: "date"
    rustfs:
      type: s3
      receives: files
      inputs: ["/dc/measurement/map", "/dc/measurement/camera"]
      bucket: "dc-files"
      endpoint: "http://127.0.0.1:9000"
      region: "us-east-1"
      access_key_id: "rustfsadmin"
      secret_access_key: "rustfsadmin"
      force_path_style: true
    files:
      delete_when_sent: true
      metadata_destination: "records_log"
      # Previews for the dashboard's camera gallery and map view (#256); best-effort,
      # so the demo is unaffected if ffmpeg isn't installed.
      thumbnails:
        enabled: true
        max_dimension: 320
    custom_config_files: ["$HOME/.dc/tb3_simulation_pgsql_minio_sink.toml"]
    vector_forward_host: "127.0.0.1"
    vector_forward_port: 24224

measurement_server:
  ros__parameters:
    robot_name: "Turtlebot"
    measurement_plugins: [
        # System
        "cpu",
        "os",
        "memory",
        "uptime",
        # Robot
        "camera",
        "cmd_vel",
        "distance_traveled",
        "driving_type",
        "position",
        "speed",
        # Environment
        "map",
        # Infrastructure
        "rustfs_health",
        "pgsql_health",
      ]
    custom_key_str_list: ["robot_name", "id"]
    custom_keys_str:
      robot_name:
        name: robot_name
        value: "Turtlebot"
      # Requires systemd package
      id:
        name: id
        value_from_file: /etc/machine-id
    run_id:
      enabled: true
      counter: true
      counter_path: "$HOME/run_id"
      uuid: false
    save_local_base_path: "$HOME/dc_data/"
    all_base_path: "=robot_name/%Y/%m/%d/%H"
    condition_plugins: ["min_distance_traveled", "max_distance_traveled"]
    # Conditions
    min_distance_traveled:
      plugin: "dc_conditions/Compare"
      key: "distance_traveled"
      value: 0.01
      comparison: "ge"
    max_distance_traveled:
      plugin: "dc_conditions/Compare"
      key: "distance_traveled"
      value: 2.0
      comparison: "le"
    # System data
    cpu:
      plugin: "dc_measurements/Cpu"
      topic_output: "/dc/measurement/cpu"
      polling_interval: 5000
      include_measurement_name: true
      init_collect: true
      max_processes: 5
      cpu_min: 5.0
    memory:
      plugin: "dc_measurements/Memory"
      topic_output: "/dc/measurement/memory"
      polling_interval: 5000
      node_name: "dc_measurement_memory"
      include_measurement_name: true
      init_collect: true
    os:
      plugin: "dc_measurements/OS"
      topic_output: "/dc/measurement/os"
      include_measurement_name: true
      init_collect: true
      init_max_measurements: 1
    uptime:
      plugin: "dc_measurements/Uptime"
      topic_output: "/dc/measurement/uptime"
      polling_interval: 5000
      enable_validator: true
      debug: true
      init_collect: true
      include_measurement_name: true
    # Robot data
    distance_traveled:
      plugin: "dc_measurements/DistanceTraveled"
      topic_output: "/dc/measurement/distance_traveled"
      if_all_conditions: ["min_distance_traveled", "max_distance_traveled"]
      global_frame: "map"
      robot_base_frame: "base_link"
      transform_timeout: 0.1
      polling_interval: 5000
      init_max_measurements: -1
      condition_max_measurements: 0
      include_measurement_name: true
      init_collect: false
    # Nav2's smoothed output is the only command source the simulation has, so the mode is
    # autonomous while it publishes and unknown otherwise. A real deployment adds its teleop
    # topic here to tell a takeover apart from an idle robot.
    driving_type:
      plugin: "dc_measurements/DrivingType"
      topic_output: "/dc/measurement/driving_type"
      polling_interval: 5000
      velocity_topics: ["/cmd_vel"]
      velocity_modes: ["autonomous"]
      velocity_timeout_s: 1.0
      enable_validator: true
      init_collect: true
      include_measurement_name: true
    cmd_vel:
      plugin: "dc_measurements/CmdVel"
      enable_validator: true
      polling_interval: 500
      topic_output: "/dc/measurement/cmd_vel"
      include_measurement_name: true
    position:
      plugin: "dc_measurements/Position"
      topic_output: "/dc/measurement/position"
      enable_validator: true
      init_collect: true
      global_frame: "map"
      robot_base_frame: "base_link"
      transform_timeout: 0.1
      include_measurement_name: true
    stops:
      plugin: "dc_measurements/Stops"
      odom_topic: "/odom"
      topic_output: "/dc/measurement/stops"
      include_measurement_name: true
    speed:
      plugin: "dc_measurements/Speed"
      odom_topic: "/odom"
      polling_interval: 500
      topic_output: "/dc/measurement/speed"
      include_measurement_name: true
    camera:
      plugin: "dc_measurements/Camera"
      topic_output: "/dc/measurement/camera"
      init_collect: false
      init_max_measurements: 0
      polling_interval: 3000
      node_name: "dc_measurement_camera"
      # dc_simulation's warehouse robot. Nav2's own sandbox waffle, which this
      # demo used to run against, carries a 320x240 depth-only sensor and no RGB
      # camera at all on Jazzy -- there was no topic here to subscribe to (#279).
      cam_topic: "/left_intel_realsense_r200_depth/image_raw"
      cam_name: "Intel Realsense"
      enable_validator: true
      draw_det_barcodes: false
      save_raw_img: true
      save_raw_path: "camera/raw/%Y-%m-%dT%H-%M-%S"
      save_rotated_img: false
      save_detections_img: false
      rotation_angle: 0
      remote_prefixes: [""]
      remote_keys: ["rustfs"]
      include_measurement_name: true
      include_measurement_plugin: true
    # Environment data
    map:
      plugin: "dc_measurements/Map"
      save_path: "map/%Y-%m-%dT%H-%M-%S"
      topic_output: "/dc/measurement/map"
      save_map_timeout: 4.0
      init_collect: false
      init_max_measurements: 1
      remote_prefixes: [""]
      remote_keys: ["rustfs"]
      enable_validator: true
      include_measurement_name: true
      quiet: true
    # Infrastructure
    rustfs_health:
      plugin: "dc_measurements/TCPHealth"
      topic_output: "/dc/measurement/rustfs_health"
      polling_interval: 5000
      host: "127.0.0.1"
      port: 9000
      name: "RustFS"
      include_measurement_plugin: true
    pgsql_health:
      plugin: "dc_measurements/TCPHealth"
      topic_output: "/dc/measurement/pgsql_health"
      polling_interval: 5000
      host: "127.0.0.1"
      port: 5432
      name: "PostgreSQL"
      include_measurement_plugin: true
