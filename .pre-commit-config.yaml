# Run by prek (https://prek.j178.dev): `prek install` for the git hook,
# `prek run --all-files` for everything.
# LICENSES/ holds verbatim licence texts — including their upstream typos. No hook edits them.
exclude: "doc/js/.*$|doc/theme/.*|doc/src/fonts/.*|doc/css/lineicon.css|^LICENSES/.*"
repos:
  - repo: local
    hooks:
      - id: build-doc
        name: Build documentation
        entry: ./tools/ci/pre-commit/build_doc.sh
        language: script
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
        name: Check that merge conflicts are not being committed
      - id: detect-private-key
        name: Detect if private key is added to the repository
      - id: check-added-large-files
        name: Detect if giant files are added
        args: ["--maxkb=2000"]
        # vector_vendor's checked-in Vector release tarballs (#424) replace a
        # build-time network download with a committed binary by design.
        exclude: "^vector_vendor/prebuilt/.*\\.tar\\.gz$"
      - id: check-docstring-first
        name: Checks for a common error of placing code before the docstring
      - id: check-executables-have-shebangs
        name: Check that executables have shebang
      - id: check-shebang-scripts-are-executable
        name: Checks that scripts with shebangs are executable
      - id: check-json
        name: Verify json syntax
      - id: check-yaml
        name: Verify yaml syntax
      - id: check-toml
        name: Verify toml syntax
      - id: check-xml
        name: Verify xml syntax
      - id: name-tests-test
        name: Assert that test files are named test_*.py
      - id: mixed-line-ending
        name: Detect if mixed line ending is used (\r vs. \r\n)
      - id: end-of-file-fixer
        name: Make sure that there is an empty line at the end
        exclude: "(.*.pgm|.*.dae|.*.sdf|.*.config|.*.svg|.*.mtl)"
      - id: trailing-whitespace
        name: Remove trailing whitespace at end of line
  # ruff replaces flake8 (+ 13 plugins), black, isort, pycln, pyupgrade, flynt and
  # yesqa; the rules standing in for them are in pyproject.toml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
      - id: ruff-format
  # Fails if uv.lock has drifted from pyproject.toml.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.5
    hooks:
      - id: uv-lock
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args:
          [
            -w,
            --ignore-words=.codespell.txt,
            -S,
            "*.pgm,uv.lock,tools/infrastructure/docker/config/grafana/dashboards/*",
          ]
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v15.0.7
    hooks:
      - id: clang-format
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.1-beta
    hooks:
      - id: hadolint-docker
        args: [--ignore, DL3008, --ignore, DL3005, --ignore, DL3013]
        # Default hook `files` regex only matches `Dockerfile`; the jazzy line's
        # Podman tooling (CLAUDE.md "Containers: Podman, not Docker") uses
        # `Containerfile` instead (tools/e2e/), including suffixed variants like
        # `Containerfile.e2e`.
        files: (^|/)(Dockerfile|Containerfile)(\.[a-zA-Z0-9_-]+)?$
  # Every file declares its copyright and license, in a header or in REUSE.toml.
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
        name: Ensure every file declares its copyright and license
  # Vendored from minipada/ros2_pre-commit: upstream walks into ./.venv, and both its
  # hooks need xmllint. See the script's docstring.
  - repo: local
    hooks:
      - id: ros2-package-versions
        name: Ensure all ROS 2 packages are of the same version
        entry: ./tools/ci/pre-commit/ros2_package_checks.py versions
        language: script
        pass_filenames: false
        files: (^|/)(package\.xml|setup\.py)$
      - id: ros2-package-metadata
        name: Ensure ROS 2 package metadata are set
        entry: ./tools/ci/pre-commit/ros2_package_checks.py metadata
        language: script
        pass_filenames: false
        files: (^|/)package\.xml$
