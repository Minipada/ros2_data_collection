# robot_params.yaml, with its Records Destination swapped from the fleet's edge-forward
# (`edge_vector` -> edge.site.example) to a direct Postgres Destination reachable on
# compose.local-destinations.yaml's `postgres` service — for trying the three-container
# robot tier end to end before fleet rollout (docs/containers-single-machine.html). The
# topology (unmanaged shipper, the local `vector` container) is otherwise unchanged: only
# what the Bridge renders into vector's config differs, per ADR-0015 — see
# doc/src/dc/destinations.md#deployment-modes-shippermanaged.
measurement_server:
  ros__parameters:
    save_local_base_path: "$HOME/.dc/robot/data/%Y/%M/%D/%H"
    all_base_path: "robot"
    measurement_plugins: ["uptime"]

    uptime:
      plugin: "dc_measurements/Uptime"
      polling_interval: 1000
      group_key: "uptime"

dc_bridge:
  ros__parameters:
    shipper:
      managed: false
      config_path: "/etc/dc/shipper/vector.toml"
      data_dir: "/var/lib/vector"
      bind_host: "0.0.0.0"
    uploader:
      data_dir: "$HOME/.dc/robot/uploader"
    # Migrated to the ADR-0003 passthrough recipe (#472): `pgsql` is now a `type: file`
    # anchor only; the real delivery to Postgres is robot_pgsql_sink.toml
    # (custom_config_files below, bind-mounted by compose.local-destinations.yaml).
    # This scenario runs `shipper.managed: false` (the three-container split, ADR-0015),
    # which used to be a real gap: `custom_config_files` snippets were validated against
    # the render but never reached the separate `vector` container's config in unmanaged
    # mode (confirmed empirically pre-#472: a passthrough postgres sink here produced a
    # `vector.toml` with no `pgsql` sink in it at all). Fixed by
    # `merge_custom_config_files` (#472), which folds every validated snippet into the
    # same file dc_bridge writes to `shipper.config_path` — the one file both modes
    # actually share — so `pgsql` no longer needs to stay blessed here.
    destinations: ["pgsql"]
    pgsql:
      type: file
      receives: records
      inputs: ["/dc/measurement/uptime"]
      path: "/tmp/dc/pgsql_anchor.ndjson"
      time_key: "date"
      time_format: "epoch_nanos"
    custom_config_files: ["$HOME/.dc/robot_pgsql_sink.toml"]

    vector_forward_host: "vector"
    vector_forward_port: 24224

lifecycle_manager_dc:
  ros__parameters:
    node_names: ["measurement_server"]
    transitions: [configure, activate]
